<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact | Meshal Al-Qushaym</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@300;400&display=swap" rel="stylesheet">
</head>
<body>

    <header>
        <div class="logo">Meshal<span>.AI</span></div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="projects.html">Projects</a></li>
                <li><a href="contact.html" class="active">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main class="contact-container">
        <h1>Get In <span class="highlight">Touch</span></h1>
        <p>Feel free to reach out for collaborations or Data Science opportunities.</p>
        
        <form name="contactForm" onsubmit="return validateForm()">
            <div class="form-group">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" placeholder="Your Name">
            </div>

            <div class="form-group">
                <label for="email">Email:</label>
                <input type="text" id="email" name="email" placeholder="Your Email">
            </div>

            <div class="form-group">
                <label for="message">Message:</label>
                <textarea id="message" name="message" rows="5" placeholder="Your Message"></textarea>
            </div>

            <button type="submit" class="cta-button" style="width: 100%; border: none; cursor: pointer;">Send Message</button>
        </form>

        <hr style="border-color: var(--space-navy); margin: 40px 0;">

        <h3 style="text-align: center;">Find me on</h3>
        <div class="social-links">
            <a href="https://github.com/MQushaym" target="_blank" class="social-btn">GitHub</a>
            <a href="https://www.linkedin.com/in/meshalgushaym" target="_blank" class="social-btn">LinkedIn</a>
            <a href="https://huggingface.co/iMeshal" target="_blank" class="social-btn">Hugging Face</a>
            <a href="https://www.kaggle.com/meshalfalah" target="_blank" class="social-btn">Kaggle</a>
        </div>
    </main>

    <footer>
        <p>&copy; 2025 Meshal Website. All Rights Reserved.</p>
    </footer>

    <script src="js/script.js"></script>

</body>
</html>
